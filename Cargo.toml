[package]
name = "arxiv"
version = "0.1.1"
edition = "2021"
description = "A fast, minimal arXiv CLI for humans and agents"
license = "MIT"
repository = "https://github.com/ishaanko/arxiv-cli"

[[bin]]
name = "arxiv"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
